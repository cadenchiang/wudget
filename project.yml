name: WalletBudget
options:
  bundleIdPrefix: com.cadenchiang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: J3BMT7MU7K
    CODE_SIGN_STYLE: Automatic

targets:
  WalletBudget:
    type: application
    platform: iOS
    sources:
      - path: WalletBudget
    dependencies:
      - target: WudgetWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadenchiang.walletbudget
        CODE_SIGN_ENTITLEMENTS: WalletBudget/WalletBudget.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wudget
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSFaceIDUsageDescription: Wudget uses Face ID to lock the app so only you can open it and see your spending.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Wudget adds the location of each Apple Pay purchase so you can see where you spent. Locations stay on your device.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: Wudget records where each Apple Pay purchase happened, even when the import runs in the background. Locations stay on your device and are never shared.

  WudgetWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WudgetWidgets
      # Shared snapshot model/store, compiled into both the app and the widget.
      - path: WalletBudget/Support/WidgetShared.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadenchiang.walletbudget.WudgetWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WudgetWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: WudgetWidgets/WudgetWidgets.entitlements

  WalletBudgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WalletBudgetTests
    dependencies:
      - target: WalletBudget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadenchiang.walletbudgetTests
        GENERATE_INFOPLIST_FILE: YES
