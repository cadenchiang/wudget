<!-- Orbit · Confirm signup template.
     Paste into Supabase dashboard: Authentication → Emails → Confirm signup.
     Suggested subject line:  Verify your email
     Variables: {{ .ConfirmationURL }} is filled by Supabase. -->
<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:#ffffff;padding:56px 16px;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:420px;">
        <tr>
          <td align="center" style="padding-bottom:16px;">
            <img src="https://lydothopnwymmjmtgpdv.supabase.co/storage/v1/object/public/assets/orbit-icon-256.png"
                 width="56" height="56" alt="Orbit"
                 style="display:block;border-radius:14px;border:1px solid #eaeaea;">
          </td>
        </tr>
        <tr>
          <td align="center" style="font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;color:#000000;padding-bottom:40px;">
            Orbit
          </td>
        </tr>
        <tr>
          <td style="border-top:1px solid #eaeaea;padding-top:40px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:20px;font-weight:600;color:#000000;" align="center">
            Verify your email
          </td>
        </tr>
        <tr>
          <td align="center" style="font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.7;color:#555555;padding:16px 24px 32px;">
            One tap and your account is ready.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:40px;">
            <a href="{{ .ConfirmationURL }}"
               style="display:inline-block;background:#000000;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;font-weight:600;text-decoration:none;padding:13px 36px;border-radius:10px;">
              Verify
            </a>
          </td>
        </tr>
        <tr>
          <td align="center" style="font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#999999;padding-bottom:40px;">
            Button not working? Paste this link into your browser:<br>
            <a href="{{ .ConfirmationURL }}" style="color:#999999;word-break:break-all;">{{ .ConfirmationURL }}</a>
          </td>
        </tr>
        <tr>
          <td align="center" style="border-top:1px solid #eaeaea;padding-top:24px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;color:#bbbbbb;">
            Orbit · Track your spending automatically.<br>
            Didn't create an account? You can safely ignore this email.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
