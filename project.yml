name: WalletBudget
options:
  bundleIdPrefix: com.cadenchiang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: J3BMT7MU7K
    CODE_SIGN_STYLE: Automatic

targets:
  WalletBudget:
    type: application
    platform: iOS
    sources:
      - path: WalletBudget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadenchiang.walletbudget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WalletBudget
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock WalletBudget with Face ID.

  WalletBudgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WalletBudgetTests
    dependencies:
      - target: WalletBudget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadenchiang.walletbudgetTests
        GENERATE_INFOPLIST_FILE: YES
